<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ValuConnect — Revenue Leak Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Spline+Sans+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2E36; --surface:#F6FAF9; --panel:#FFFFFF;
    --teal:#127C74; --teal-dark:#0C5A54;
    --leak:#D6453D; --amber:#E8A13C; --green:#1F8A5D;
    --line:#D8E4E2; --muted:#5C7A78;
    --display:'Bricolage Grotesque',sans-serif;
    --body:'Instrument Sans',sans-serif;
    --mono:'Spline Sans Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--body);background:var(--surface);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1060px;margin:0 auto;padding:0 20px}

  header{border-bottom:1px solid var(--line);background:var(--panel)}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
  .brand{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
  .brand span{color:var(--teal)}
  .lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .lang button{border:0;background:transparent;font-family:var(--body);font-weight:600;font-size:.8rem;padding:7px 14px;cursor:pointer;color:var(--muted)}
  .lang button.on{background:var(--ink);color:#fff}
  .lang button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}

  .hero{padding:52px 0 34px;text-align:left;max-width:720px}
  .eyebrow{font-family:var(--mono);font-weight:700;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
  h1{font-family:var(--display);font-weight:800;font-size:clamp(2rem,5vw,3.1rem);line-height:1.06;letter-spacing:-.02em;margin:14px 0 12px}
  h1 em{font-style:normal;color:var(--leak)}
  .sub{color:var(--muted);font-size:1.02rem;max-width:560px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding-bottom:70px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px}
  .card h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin-bottom:20px}

  .field{margin-bottom:22px}
  label{display:block;font-weight:600;font-size:.86rem;margin-bottom:8px}
  select,input[type=number]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-family:var(--body);font-size:.95rem;background:var(--surface);color:var(--ink)}
  select:focus,input:focus{outline:2px solid var(--teal);outline-offset:1px}
  .sliderrow{display:flex;align-items:center;gap:14px}
  input[type=range]{flex:1;accent-color:var(--teal);height:4px}
  .val{font-family:var(--mono);font-weight:700;font-size:.95rem;min-width:64px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .hint{font-size:.76rem;color:var(--muted);margin-top:6px}

  /* Signature: the leak meter */
  .meter{position:relative;background:var(--ink);color:#fff;border-radius:16px;padding:28px 26px 26px;overflow:hidden}
  .pipe{position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,#1B4650,#2A6B70)}
  .drop{position:absolute;top:6px;width:9px;height:13px;background:var(--leak);border-radius:50% 50% 55% 55%/40% 40% 62% 62%;animation:drip 1.6s linear infinite;opacity:.9}
  .drop.d2{animation-delay:.55s}
  .drop.d3{animation-delay:1.1s}
  @keyframes drip{0%{transform:translateY(0) scale(.7);opacity:0}12%{opacity:.95;transform:translateY(6px) scale(1)}88%{opacity:.95}100%{transform:translateY(210px) scale(1);opacity:0}}
  @media(prefers-reduced-motion:reduce){.drop{animation:none;opacity:0}}
  .meter .lbl{font-family:var(--mono);font-weight:700;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:#8FB8B4}
  .big{font-family:var(--mono);font-weight:700;font-size:clamp(2.4rem,6vw,3.4rem);letter-spacing:-.02em;color:#FF6E64;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .per{font-size:.85rem;color:#B9D2CF;margin-bottom:20px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid #24505A;padding-top:16px}
  .stat .lbl2{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:#8FB8B4}
  .stat .n{font-family:var(--mono);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
  .n.red{color:#FF6E64}.n.green{color:#5FD3A0}

  .formula{margin-top:14px;font-family:var(--mono);font-size:.68rem;color:#7FA8A4;letter-spacing:.02em}

  .reco{margin-top:26px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:12px;padding:20px 22px}
  .reco .tag{font-family:var(--mono);font-weight:700;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
  .reco h3{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:6px 0 4px}
  .reco p{font-size:.9rem;color:var(--muted)}
  .roi{font-family:var(--mono);font-weight:700;color:var(--green)}

  .cta{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .btn{display:inline-block;background:var(--teal);color:#fff;font-weight:600;font-size:.95rem;padding:13px 24px;border-radius:10px;text-decoration:none;border:0;cursor:pointer}
  .btn:hover{background:var(--teal-dark)}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .ctanote{font-size:.8rem;color:var(--muted)}

  footer{border-top:1px solid var(--line);padding:20px 0 34px;font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<header><div class="wrap hd">
  <a class="brand" href="index.html" style="color:inherit;text-decoration:none">ValuConnect <span>Solutions</span></a>
  <div class="lang" role="group" aria-label="Language">
    <button id="btnEN" class="on" onclick="setLang('en')">EN</button>
    <button id="btnES" onclick="setLang('es')">ES</button>
  </div>
</div></header>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow" data-i="eyebrow">Revenue Leak Audit</div>
    <h1 id="h1"></h1>
    <p class="sub" data-i="sub"></p>
  </div>

  <div class="grid">
    <div class="card">
      <h2 data-i="yourNumbers"></h2>

      <div class="field">
        <label for="industry" data-i="industry"></label>
        <select id="industry" onchange="pickIndustry()"></select>
      </div>

      <div class="field">
        <label for="missed" data-i="missed"></label>
        <div class="sliderrow">
          <input type="range" id="missed" min="1" max="80" value="12" oninput="calc()">
          <div class="val" id="missedVal">12</div>
        </div>
        <div class="hint" data-i="missedHint"></div>
      </div>

      <div class="field">
        <label for="value" data-i="avgValue"></label>
        <input type="number" id="value" min="20" step="10" value="450" oninput="calc()">
        <div class="hint" data-i="valueHint"></div>
      </div>

      <div class="field">
        <label for="close" data-i="closeRate"></label>
        <div class="sliderrow">
          <input type="range" id="close" min="10" max="60" value="30" oninput="calc()">
          <div class="val" id="closeVal">30%</div>
        </div>
      </div>
    </div>

    <div>
      <div class="meter">
        <div class="pipe"></div>
        <div class="drop" style="left:22%"></div>
        <div class="drop d2" style="left:52%"></div>
        <div class="drop d3" style="left:78%"></div>
        <div class="lbl" data-i="meterLbl"></div>
        <div class="big" id="leakMo">$0</div>
        <div class="per" data-i="perMonth"></div>
        <div class="row2">
          <div class="stat"><div class="lbl2" data-i="perYear"></div><div class="n red" id="leakYr">$0</div></div>
          <div class="stat"><div class="lbl2" data-i="recoverable"></div><div class="n green" id="recov">$0</div></div>
        </div>
        <div class="formula" id="formula"></div>
      </div>

      <div class="reco">
        <div class="tag" data-i="recoTag"></div>
        <h3 id="pkgName"></h3>
        <p id="pkgLine"></p>
      </div>

      <div class="cta">
        <button class="btn" id="ctaBtn" onclick="bookAudit()"></button>
        <div class="ctanote" data-i="ctaNote"></div>
      </div>
    </div>
  </div>
</div>

<footer><div class="wrap" data-i="foot"></div></footer>

<script>
const INDUSTRIES = [
  {id:'hvac',   en:'HVAC / Home services', es:'HVAC / Servicios del hogar', value:450},
  {id:'dental', en:'Dental practice',       es:'Consultorio dental',         value:250},
  {id:'medspa', en:'Med spa / Aesthetics',  es:'Med spa / Estética',         value:300},
  {id:'auto',   en:'Auto repair shop',      es:'Taller mecánico',            value:250},
  {id:'law',    en:'Law firm (intake)',     es:'Bufete de abogados',         value:2000},
  {id:'clean',  en:'Cleaning company',      es:'Empresa de limpieza',        value:180},
  {id:'salon',  en:'Salon / Barbershop',    es:'Salón / Barbería',           value:75},
  {id:'other',  en:'Other service business',es:'Otro negocio de servicios',  value:200}
];

const T = {
en:{
  eyebrow:'Revenue Leak Audit',
  h1:'How much is your business <em>leaking</em> every month?',
  sub:'Roughly 62% of calls to small businesses go unanswered — and 85% of those callers never call back. Enter your real numbers and watch the leak.',
  yourNumbers:'Your numbers',
  industry:'Your industry',
  missed:'Missed calls per week',
  missedHint:'Check your phone logs — most owners underestimate this by half.',
  avgValue:'Average customer value ($)',
  valueHint:'What one new customer is worth to you (first job, not lifetime).',
  closeRate:'Your close rate on answered calls',
  meterLbl:'Estimated revenue leak',
  perMonth:'per month, walking out the door',
  perYear:'Per year',
  recoverable:'Recoverable with AI*',
  recoTag:'Recommended fix',
  ctaNote:'$497 Leak Audit — credited toward any install.',
  cta:'Book your Leak Audit',
  foot:'*Assumes AI systems capture ~60% of currently missed opportunities. Estimates based on industry research (411 Locals, Invoca, BIA/Kelsey): 62% of calls unanswered, 85% of missed callers never call back. Your audit uses your actual 30-day call data. © ValuConnect Solutions.',
  pkgs:{
    t1:{name:'Leak Stopper',line:'AI receptionist 24/7 + missed-call text-back + speed-to-lead. $2,500 setup + $597/mo — recovering ~{R}/mo is a {X}× return on the retainer.'},
    t2:{name:'Revenue Recovery System',line:'Everything in Leak Stopper plus quote follow-ups, no-show recovery, database reactivation and a review engine. $5,500 setup + $1,197/mo — recovering ~{R}/mo is a {X}× return.'},
    t3:{name:'AI Operations Partner',line:'Full install: AI intake, dispatch optimization, custom workflows, bilingual engagement. From $8,500 setup + $1,997/mo — recovering ~{R}/mo is a {X}× return.'}
  },
  formula:'{m} missed/mo × ${v} × {c}% close × 0.85 never call back'
},
es:{
  eyebrow:'Auditoría de Fugas de Ingresos',
  h1:'¿Cuánto dinero está <em>fugando</em> tu negocio cada mes?',
  sub:'Cerca del 62% de las llamadas a negocios pequeños no se contestan — y el 85% de esos clientes nunca vuelve a llamar. Ingresa tus números reales y mira la fuga.',
  yourNumbers:'Tus números',
  industry:'Tu industria',
  missed:'Llamadas perdidas por semana',
  missedHint:'Revisa tu registro de llamadas — la mayoría lo subestima a la mitad.',
  avgValue:'Valor promedio por cliente ($)',
  valueHint:'Lo que vale un cliente nuevo (primer trabajo, no de por vida).',
  closeRate:'Tu tasa de cierre en llamadas contestadas',
  meterLbl:'Fuga estimada de ingresos',
  perMonth:'por mes, saliendo por la puerta',
  perYear:'Por año',
  recoverable:'Recuperable con IA*',
  recoTag:'Solución recomendada',
  ctaNote:'Auditoría de Fugas $497 — se acredita a cualquier instalación.',
  cta:'Agenda tu Auditoría de Fugas',
  foot:'*Asume que los sistemas de IA capturan ~60% de las oportunidades perdidas. Estimados basados en investigación de la industria (411 Locals, Invoca, BIA/Kelsey): 62% de llamadas sin contestar, 85% de clientes que no vuelven a llamar. Tu auditoría usa tus datos reales de 30 días. © ValuConnect Solutions.',
  pkgs:{
    t1:{name:'Tapa Fugas',line:'Recepcionista IA 24/7 + texto automático por llamada perdida + respuesta inmediata a leads. $2,500 instalación + $597/mes — recuperar ~{R}/mes es un retorno de {X}× sobre la mensualidad.'},
    t2:{name:'Sistema de Recuperación de Ingresos',line:'Todo lo del Tapa Fugas más seguimiento de cotizaciones, recuperación de citas perdidas, reactivación de clientes y motor de reseñas. $5,500 + $1,197/mes — recuperar ~{R}/mes es un retorno de {X}×.'},
    t3:{name:'Socio de Operaciones IA',line:'Instalación completa: intake con IA, optimización de agenda, flujos personalizados, atención bilingüe. Desde $8,500 + $1,997/mes — recuperar ~{R}/mes es un retorno de {X}×.'}
  },
  formula:'{m} perdidas/mes × ${v} × {c}% cierre × 0.85 no vuelven a llamar'
}};

let lang='en', shown=0, raf=null;
const $=id=>document.getElementById(id);
const money=n=>'$'+Math.round(n).toLocaleString(lang==='es'?'es-US':'en-US');

function fillIndustries(){
  const sel=$('industry'), cur=sel.value;
  sel.innerHTML='';
  INDUSTRIES.forEach(i=>{
    const o=document.createElement('option');
    o.value=i.id;o.textContent=i[lang];sel.appendChild(o);
  });
  sel.value=cur||'hvac';
}
function pickIndustry(){
  const ind=INDUSTRIES.find(i=>i.id===$('industry').value);
  if(ind)$('value').value=ind.value;
  calc();
}
function setLang(l){
  lang=l;
  $('btnEN').classList.toggle('on',l==='en');
  $('btnES').classList.toggle('on',l==='es');
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=T[l][el.dataset.i]||el.textContent;});
  $('h1').innerHTML=T[l].h1;
  $('ctaBtn').textContent=T[l].cta;
  fillIndustries();
  calc();
}
function animateTo(target){
  if(raf)cancelAnimationFrame(raf);
  const start=shown, dur=600, t0=performance.now();
  const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){shown=target;$('leakMo').textContent=money(target);return;}
  function step(t){
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    shown=start+(target-start)*e;
    $('leakMo').textContent=money(shown);
    if(p<1)raf=requestAnimationFrame(step);
  }
  raf=requestAnimationFrame(step);
}
function calc(){
  const wk=+$('missed').value, v=+$('value').value||0, c=+$('close').value;
  $('missedVal').textContent=wk;
  $('closeVal').textContent=c+'%';
  const mo=wk*4.33;
  const leakMo=mo*v*(c/100)*0.85;
  const leakYr=leakMo*12;
  const recov=leakMo*0.6;
  animateTo(leakMo);
  $('leakYr').textContent=money(leakYr);
  $('recov').textContent=money(recov);
  $('formula').textContent=T[lang].formula.replace('{m}',Math.round(mo)).replace('{v}',v.toLocaleString()).replace('{c}',c);
  // package recommendation
  let pkg,ret;
  if(leakMo<1500){pkg=T[lang].pkgs.t1;ret=597;}
  else if(leakMo<5000){pkg=T[lang].pkgs.t2;ret=1197;}
  else{pkg=T[lang].pkgs.t3;ret=1997;}
  const roi=recov>0?Math.max(1,(recov/ret)).toFixed(1):'—';
  $('pkgName').textContent=pkg.name;
  $('pkgLine').textContent=pkg.line.replace('{R}',money(recov)).replace('{X}',roi);
}
function bookAudit(){
  const s=lang==='es'?'Quiero mi Auditoría de Fugas':'I want my Leak Audit';
  const b=lang==='es'
    ?`Hola ValuConnect, mi fuga estimada es ${$('leakMo').textContent}/mes. Quiero agendar mi auditoría.`
    :`Hi ValuConnect, my estimated leak is ${$('leakMo').textContent}/month. I'd like to book my audit.`;
  window.location.href=`mailto:info@vcsolutions.us?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(b)}`;
}
fillIndustries();
setLang('en');
</script>
</body>
</html>
